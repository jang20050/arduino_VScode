; PlatformIO 설정 — 아두이노 우노 실습
; src_dir 은 기본값(00_check)이며, 다른 실습은 tools/lab.py 가
; PLATFORMIO_SRC_DIR 환경변수로 labs/NN_이름 을 지정해 빌드한다.

[platformio]
src_dir = labs/02_LCD_Helloworld
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 9600
; arduino-cli 로 설치한 라이브러리를 그대로 공유
lib_extra_dirs = C:/Users/jang2/OneDrive/문서/Arduino/libraries
